<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- import font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Pomodoro Timer</title>
</head>
<body>
    <div class="container">
        <h1>Pomodoro Timer</h1>
        <div class="tabs">
            <button class="tab active" data-mode="pomodoro" data-time="1500">Pomodoro</button>
            <button class="tab" data-mode="short-break" data-time="300">Short Break</button>
            <button class="tab" data-mode="long-break" data-time="900">Long Break</button>
        </div>
        <div class="timer" id="timer">25:00</div>
        <div class="button-container">
            <button class="btn-start">start</button>
            <!-- <button class="btn-stop">stop</button> -->
        </div>
    </div>
</body>
<script src="./index.js"></script>
</html>
